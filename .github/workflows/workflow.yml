name: First workflow
on: workflow_dispatch
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: List all Files
        run: ls -a
      - name: Print Working Directory
        run: pwd
      - name: Create JS File
        run: echo 'console.log("Hello World!");' > app.js
      - name: List all Files
        run: ls -a
      - name: Run Node JS
        run: node app.js
