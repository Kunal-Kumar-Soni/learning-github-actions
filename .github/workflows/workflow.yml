name: First workflow
on: [push, workflow_dispatch]
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: List All Files
        run: ls -a
      - name: Print Working Directory
        run: pwd
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: List All Files
        run: ls -a
