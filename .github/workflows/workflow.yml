name: First workflow
on: workflow_dispatch
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: List all Files
        run: ls -a
      - name: Print Working Directory
        run: pwd
      - name: Create JS File
        run: echo 'console.log("Hello World!");' > app.js
      - name: Check Runner Specifications
        run: |
         echo "=== CPU SPECIFICATIONS ==="
         lscpu | grep -E "Model name|Core\(s\) per socket|Socket\(s\)|Thread\(s\) per core|CPU\(s\):"
    
         echo -e "\n=== RAM SPECIFICATIONS ==="
         free -h
    
         echo -e "\n=== STORAGE SPECIFICATIONS ==="
         df -h /

      - name: Run Node JS
        run: node app.js
