name: First workflow
on: [push,workflow_dispatch]
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: List all Files
        run: ls -a
      - name: Print Working Directory
        run: pwd
      - name: Create JS File
        run: echo 'console.log("Hello World!");' > app.js
      - name: Run Node JS
        run: node app.js

  second-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check Runner Specifications
        run: |
          l\scpu | grep -E "Model name|Core\(s\)|Socket\(s\)|CPU\(s\):"
           free -h
           df -h /
          uname -a
          cat /etc/os-release | grep PRETTY_NAME
